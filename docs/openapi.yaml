openapi: 3.0.3
info:
  title: SIGR API REST
  version: 1.1.0
  description: 'API REST del Sistema Integral de Gestión de Restaurante (SIGR): autenticación
    con roles, menú, pedidos, reservas, facturación, cierre de caja y reportes de
    ventas.'
  license:
    name: MIT
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Inicia sesión con correo y contraseña y devuelve el token.
      summary: Iniciar sesión
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: 'Cierra la sesión: el token deja de ser válido.'
      summary: Cerrar sesión
      tags:
      - Autenticación
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/registro/:
    post:
      operationId: v1_auth_registro_create
      description: Crea una cuenta de cliente y devuelve su token.
      summary: Registrar un cliente
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
          description: ''
  /api/v1/auth/yo/:
    get:
      operationId: v1_auth_yo_retrieve
      description: Datos de la cuenta autenticada; se pueden editar el nombre, el
        apellido y el teléfono.
      summary: Ver mi cuenta
      tags:
      - Autenticación
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
    patch:
      operationId: v1_auth_yo_partial_update
      description: Datos de la cuenta autenticada; se pueden editar el nombre, el
        apellido y el teléfono.
      summary: Editar mi cuenta
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPerfilRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
          description: ''
  /api/v1/caja/cierres/:
    get:
      operationId: v1_caja_cierres_list
      summary: Listar cierres de caja (administrador)
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Caja
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCierreCajaList'
          description: ''
    post:
      operationId: v1_caja_cierres_create
      description: Compara el efectivo contado con las ventas facturadas del día y
        guarda la diferencia. Un cierre no se puede modificar, eliminar ni repetir
        (409). No se permite con pedidos del día sin cerrar.
      summary: Cerrar la caja de un día (administrador)
      tags:
      - Caja
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CierreCajaCrearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CierreCajaCrearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CierreCajaCrearRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreCaja'
          description: ''
  /api/v1/caja/cierres/{id}/:
    get:
      operationId: v1_caja_cierres_retrieve
      summary: Ver un cierre de caja (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este cierre de caja.
        required: true
      tags:
      - Caja
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CierreCaja'
          description: ''
  /api/v1/caja/facturas/:
    get:
      operationId: v1_caja_facturas_list
      summary: Listar facturas (administrador)
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Caja
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFacturaList'
          description: ''
  /api/v1/caja/facturas/{id}/:
    get:
      operationId: v1_caja_facturas_retrieve
      summary: Ver una factura con el detalle del pedido (una factura ajena responde
        404 al cliente)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este factura.
        required: true
      tags:
      - Caja
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacturaDetalle'
          description: ''
  /api/v1/caja/reportes/ventas/:
    get:
      operationId: v1_caja_reportes_ventas_retrieve
      summary: Reporte de ventas por rango de fechas (administrador)
      parameters:
      - in: query
        name: desde
        schema:
          type: string
        description: AAAA-MM-DD; por defecto, hace 6 días.
      - in: query
        name: hasta
        schema:
          type: string
        description: AAAA-MM-DD; por defecto, hoy. No puede ser futura ni superar
          un año de rango.
      tags:
      - Caja
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteVentas'
          description: ''
  /api/v1/caja/resumen/:
    get:
      operationId: v1_caja_resumen_retrieve
      description: El mesero solo ve el total de ventas del día; el administrador
        ve además facturas, pedidos sin cerrar y el cierre.
      summary: Resumen de caja del día
      tags:
      - Caja
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenCaja'
          description: ''
  /api/v1/categorias/:
    get:
      operationId: v1_categorias_list
      summary: Listar categorías (el público ve solo las activas)
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - 'Menú: categorías'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoriaList'
          description: ''
    post:
      operationId: v1_categorias_create
      summary: Crear una categoría (administrador)
      tags:
      - 'Menú: categorías'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
  /api/v1/categorias/{id}/:
    get:
      operationId: v1_categorias_retrieve
      summary: Ver una categoría
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este categoría.
        required: true
      tags:
      - 'Menú: categorías'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
    put:
      operationId: v1_categorias_update
      summary: Reemplazar una categoría (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este categoría.
        required: true
      tags:
      - 'Menú: categorías'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
    patch:
      operationId: v1_categorias_partial_update
      summary: Editar una categoría (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este categoría.
        required: true
      tags:
      - 'Menú: categorías'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoriaRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
          description: ''
    delete:
      operationId: v1_categorias_destroy
      summary: Eliminar una categoría (administrador); 409 si tiene platos
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este categoría.
        required: true
      tags:
      - 'Menú: categorías'
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/pedidos/:
    get:
      operationId: v1_pedidos_list
      description: El cliente crea y sigue sus pedidos; el personal registra pedidos
        de mesa y los avanza de estado.
      summary: Listar pedidos (el cliente ve solo los suyos; el personal, todos)
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - activos
          - cancelado
          - cerrado
          - en_preparacion
          - listo
          - pendiente
          - servido
        description: Filtra por estado.
      - in: query
        name: mesa
        schema:
          type: integer
        description: Número de mesa (1 a 99).
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Pedidos
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPedidoList'
          description: ''
    post:
      operationId: v1_pedidos_create
      description: El cliente crea y sigue sus pedidos; el personal registra pedidos
        de mesa y los avanza de estado.
      summary: Crear un pedido
      tags:
      - Pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoCrearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PedidoCrearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PedidoCrearRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/v1/pedidos/{id}/:
    get:
      operationId: v1_pedidos_retrieve
      description: El cliente crea y sigue sus pedidos; el personal registra pedidos
        de mesa y los avanza de estado.
      summary: Ver un pedido (un pedido ajeno responde 404)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este pedido.
        required: true
      tags:
      - Pedidos
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/v1/pedidos/{id}/avanzar/:
    post:
      operationId: v1_pedidos_avanzar_create
      description: Si se envía `desde` y el pedido ya no está en ese estado, responde
        409.
      summary: Avanzar el pedido al siguiente estado (personal)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este pedido.
        required: true
      tags:
      - Pedidos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambioEstadoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambioEstadoRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/v1/pedidos/{id}/cancelar/:
    post:
      operationId: v1_pedidos_cancelar_create
      description: El cliente crea y sigue sus pedidos; el personal registra pedidos
        de mesa y los avanza de estado.
      summary: Cancelar un pedido pendiente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este pedido.
        required: true
      tags:
      - Pedidos
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
          description: ''
  /api/v1/platos/:
    get:
      operationId: v1_platos_list
      description: El público y los clientes ven solo platos disponibles de categorías
        activas; el personal ve todos.
      summary: Listar platos (carta)
      parameters:
      - in: query
        name: categoria
        schema:
          type: integer
        description: Id de la categoría.
      - in: query
        name: disponible
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Solo el personal.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Texto a buscar en nombre o descripción (máx. 100).
      tags:
      - 'Menú: platos'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlatoList'
          description: ''
    post:
      operationId: v1_platos_create
      summary: Crear un plato, con foto opcional (administrador)
      tags:
      - 'Menú: platos'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatoRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plato'
          description: ''
  /api/v1/platos/{id}/:
    get:
      operationId: v1_platos_retrieve
      summary: Ver un plato
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este plato.
        required: true
      tags:
      - 'Menú: platos'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plato'
          description: ''
    put:
      operationId: v1_platos_update
      summary: Reemplazar un plato (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este plato.
        required: true
      tags:
      - 'Menú: platos'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlatoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatoRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plato'
          description: ''
    patch:
      operationId: v1_platos_partial_update
      summary: Editar un plato (administrador)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este plato.
        required: true
      tags:
      - 'Menú: platos'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPlatoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPlatoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPlatoRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plato'
          description: ''
    delete:
      operationId: v1_platos_destroy
      summary: Eliminar un plato (administrador); 409 si tiene pedidos
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este plato.
        required: true
      tags:
      - 'Menú: platos'
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/platos/{id}/disponibilidad/:
    post:
      operationId: v1_platos_disponibilidad_create
      summary: Alternar la disponibilidad de un plato (personal)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un valor de entero único que identifique este plato.
        required: true
      tags:
      - 'Menú: platos'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plato'
          description: ''
  /api/v1/platos/destacados/:
    get:
      operationId: v1_platos_destacados_list
      summary: Platos destacados del inicio (máximo 6)
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - 'Menú: platos'
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlatoList'
          description: ''
  /api/v1/reservas/:
    get:
      operationId: v1_reservas_list
      summary: Listar reservas (el cliente ve solo las suyas; el personal, todas)
      parameters:
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - cancelada
          - completada
          - confirmada
          - pendiente
          - vigentes
        description: Filtra por estado.
      - in: query
        name: fecha
        schema:
          type: string
        description: Fecha en formato AAAA-MM-DD.
      - in: query
        name: mesa
        schema:
          type: integer
        description: Número de mesa (1 a 99).
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Reservas
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservaList'
          description: ''
    post:
      operationId: v1_reservas_create
      description: Franjas de media hora entre 11:00 y 20:00, duración de 2 horas,
        anticipación de 1 hora a 30 días y hasta 12 personas. Un cruce de horario
        responde 409.
      summary: Reservar una mesa (solo clientes)
      tags:
      - Reservas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservaCrearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservaCrearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservaCrearRequest'
        required: true
