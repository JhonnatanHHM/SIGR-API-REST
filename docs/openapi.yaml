          - $ref: '#/components/schemas/RolEnum'
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
      - rol
    PersonalRequest:
      type: object
      description: Alta de personal (mesero o administrador) hecha por un administrador.
      properties:
        first_name:
          type: string
          minLength: 1
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        last_name:
          type: string
          minLength: 1
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        telefono:
          oneOf:
          - type: string
            maxLength: 40
            pattern: ^\+?\d{7,15}$
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        password_confirmacion:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        rol:
          $ref: '#/components/schemas/RolPersonalEnum'
      required:
      - email
      - first_name
      - last_name
      - password
      - password_confirmacion
      - rol
    Plato:
      type: object
