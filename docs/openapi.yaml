      properties:
        first_name:
          type: string
          minLength: 1
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        last_name:
          type: string
          minLength: 1
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        telefono:
          oneOf:
          - type: string
            maxLength: 40
            pattern: ^\+?\d{7,15}$
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        password_confirmacion:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
