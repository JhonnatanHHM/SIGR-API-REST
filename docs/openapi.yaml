          type: string
          readOnly: true
        nombre:
          type: string
          pattern: ^\w[\w ,.'&()/\-]*$
          maxLength: 100
        descripcion:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
            maxLength: 500
          - type: string
            maxLength: 0
        precio:
          type: string
          pattern: ^\d{1,7}([.,]\d{1,2})?$
          example: '28000.50'
        disponible:
          type: boolean
          default: true
        destacado:
          type: boolean
          default: false
        imagen:
          type: string
          format: uri
          nullable: true
      required:
      - categoria
      - categoria_nombre
      - id
      - nombre
      - precio
    PlatoRequest:
      type: object
      properties:
        categoria:
          type: integer
        nombre:
          type: string
          minLength: 1
          pattern: ^\w[\w ,.'&()/\-]*$
          maxLength: 100
        descripcion:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
            maxLength: 500
          - type: string
            maxLength: 0
        precio:
          type: string
          pattern: ^\d{1,7}([.,]\d{1,2})?$
          example: '28000.50'
        disponible:
          type: boolean
          default: true
        destacado:
          type: boolean
          default: false
        imagen:
          type: string
          format: binary
