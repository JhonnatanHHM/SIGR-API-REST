      - estado
      - estado_etiqueta
      - factura
      - id
      - items
      - mesa
      - notas
      - puede_cancelarse
      - registrado_por_nombre
      - siguiente_estado
      - total
    PedidoCrearRequest:
      type: object
      description: Entrada de un pedido. El precio se toma SIEMPRE de la base de datos;
        cualquier otro dato enviado se ignora.
      properties:
        mesa:
          type: integer
          maximum: 99
          minimum: 1
        notas:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
            maxLength: 200
          - type: string
            maxLength: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemEntradaRequest'
      required:
