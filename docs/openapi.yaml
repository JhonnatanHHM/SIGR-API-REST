          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Usuario'
    PatchedCategoriaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: ^\w[\w ,.'&()/\-]*$
          maxLength: 60
        descripcion:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
            maxLength: 200
          - type: string
            maxLength: 0
        orden:
          type: integer
          maximum: 999
          minimum: 0
          default: 0
        activa:
          type: boolean
          default: true
    PatchedPerfilRequest:
      type: object
      description: El usuario solo edita su nombre, apellido y teléfono; el correo
        y el rol son de solo lectura.
      properties:
        first_name:
          type: string
          minLength: 1
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        last_name:
          type: string
          minLength: 1
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        telefono:
          oneOf:
          - type: string
            maxLength: 40
            pattern: ^\+?\d{7,15}$
          - type: string
            maxLength: 0
    PatchedPlatoRequest:
      type: object
      properties:
        categoria:
          type: integer
        nombre:
          type: string
          minLength: 1
          pattern: ^\w[\w ,.'&()/\-]*$
          maxLength: 100
        descripcion:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
