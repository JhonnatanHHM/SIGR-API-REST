components:
  schemas:
    CambioEstadoRequest:
      type: object
      description: 'Estado que la persona veía al actuar (opcional): si ya cambió,
        la API responde 409 en vez de saltarse pasos.'
      properties:
        desde:
          $ref: '#/components/schemas/EstadoPedidoEnum'
    CambioEstadoReservaRequest:
      type: object
      description: 'Estado que la persona veía al actuar (opcional): si ya cambió,
        la API responde 409.'
      properties:
        desde:
          $ref: '#/components/schemas/EstadoReservaEnum'
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          pattern: ^\w[\w ,.'&()/\-]*$
          maxLength: 60
        descripcion:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
            maxLength: 200
          - type: string
            maxLength: 0
        orden:
          type: integer
          maximum: 999
          minimum: 0
          default: 0
        activa:
          type: boolean
          default: true
      required:
      - id
      - nombre
    CategoriaRequest:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: ^\w[\w ,.'&()/\-]*$
          maxLength: 60
        descripcion:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
            maxLength: 200
          - type: string
            maxLength: 0
        orden:
          type: integer
          maximum: 999
          minimum: 0
          default: 0
        activa:
          type: boolean
          default: true
      required:
      - nombre
    CierreCaja:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        fecha:
          type: string
          format: date
          readOnly: true
        total_ventas:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          title: Total de ventas
        numero_facturas:
          type: integer
          readOnly: true
          title: Facturas emitidas
        efectivo_contado:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        diferencia:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        resultado:
          type: string
          readOnly: true
        observaciones:
          type: string
          readOnly: true
        cerrado_por:
          type: integer
          readOnly: true
        cerrado_por_nombre:
          type: string
          readOnly: true
        cerrado:
          type: string
          format: date-time
          readOnly: true
          title: Cerrado el
      required:
      - cerrado
      - cerrado_por
      - cerrado_por_nombre
      - diferencia
      - efectivo_contado
      - fecha
      - id
      - numero_facturas
      - observaciones
      - resultado
      - total_ventas
    CierreCajaCrearRequest:
      type: object
      description: Entrada del cierre de caja. El total de ventas, la diferencia y
        quién cierra se calculan en el servidor.
      properties:
        fecha:
          type: string
          format: date
        efectivo_contado:
          type: string
          pattern: ^\d{1,7}([.,]\d{1,2})?$
          example: '28000.50'
        observaciones:
          oneOf:
          - type: string
            pattern: ^[^<>\u0000-\u0008\u000b-\u001f\u007f]*$
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - efectivo_contado
      - fecha
    EstadoPedidoEnum:
      enum:
      - pendiente
      - en_preparacion
      - listo
      - servido
      - cerrado
      - cancelado
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `en_preparacion` - En preparación
        * `listo` - Listo
        * `servido` - Servido
        * `cerrado` - Cerrado
        * `cancelado` - Cancelado
    EstadoReservaEnum:
      enum:
      - pendiente
      - confirmada
      - completada
      - cancelada
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `confirmada` - Confirmada
        * `completada` - Completada
        * `cancelada` - Cancelada
    Factura:
      type: object
      description: Factura para listados (solo lectura).
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: string
          readOnly: true
        pedido:
          type: integer
          readOnly: true
        mesa:
          type: integer
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        emitida:
          type: string
          format: date-time
          readOnly: true
        emitida_por:
          type: integer
          readOnly: true
        emitida_por_nombre:
          type: string
          readOnly: true
      required:
      - emitida
      - emitida_por
      - emitida_por_nombre
      - id
      - mesa
      - numero
      - pedido
      - total
    FacturaDetalle:
      type: object
      description: Factura con el detalle completo del pedido (el documento que se
        imprime).
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: string
          readOnly: true
        pedido:
          type: integer
          readOnly: true
        mesa:
          type: integer
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        emitida:
          type: string
          format: date-time
          readOnly: true
        emitida_por:
          type: integer
          readOnly: true
        emitida_por_nombre:
          type: string
          readOnly: true
        pedido_detalle:
          allOf:
          - $ref: '#/components/schemas/Pedido'
          readOnly: true
      required:
      - emitida
      - emitida_por
      - emitida_por_nombre
      - id
      - mesa
      - numero
      - pedido
      - pedido_detalle
      - total
    HoraEnum:
      enum:
      - '11:00'
      - '11:30'
      - '12:00'
      - '12:30'
      - '13:00'
      - '13:30'
      - '14:00'
      - '14:30'
      - '15:00'
      - '15:30'
      - '16:00'
      - '16:30'
      - '17:00'
      - '17:30'
      - '18:00'
      - '18:30'
      - '19:00'
      - '19:30'
      - '20:00'
      type: string
      description: |-
        * `11:00` - 11:00
        * `11:30` - 11:30
        * `12:00` - 12:00
        * `12:30` - 12:30
        * `13:00` - 13:00
        * `13:30` - 13:30
        * `14:00` - 14:00
        * `14:30` - 14:30
        * `15:00` - 15:00
        * `15:30` - 15:30
        * `16:00` - 16:00
        * `16:30` - 16:30
        * `17:00` - 17:00
        * `17:30` - 17:30
        * `18:00` - 18:00
        * `18:30` - 18:30
        * `19:00` - 19:00
        * `19:30` - 19:30
        * `20:00` - 20:00
    ItemEntradaRequest:
      type: object
      properties:
        plato:
          type: integer
        cantidad:
          type: integer
          maximum: 50
          minimum: 1
      required:
      - cantidad
      - plato
    ItemPedido:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        plato:
          type: integer
          readOnly: true
        plato_nombre:
          type: string
          readOnly: true
        cantidad:
          type: integer
          readOnly: true
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,2})?$
          readOnly: true
        subtotal:
          type: string
          readOnly: true
      required:
      - cantidad
      - id
      - plato
      - plato_nombre
      - precio_unitario
      - subtotal
    LoginRequest:
      type: object
      properties:
        email:
