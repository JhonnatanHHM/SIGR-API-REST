          format: email
          readOnly: true
          title: Correo electrónico
        first_name:
          type: string
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        last_name:
          type: string
          pattern: ^[^\W\d_]+(?:[ '\-][^\W\d_]+)*$
          maxLength: 60
        telefono:
          oneOf:
          - type: string
            maxLength: 40
            pattern: ^\+?\d{7,15}$
          - type: string
            maxLength: 0
        rol:
