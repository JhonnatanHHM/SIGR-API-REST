      required:
      - estado
      - servicio
      - version
    Sesion:
      type: object
      description: 'Respuesta de registro e ingreso: el token que se envía en `Authorization:
        Token <token>` y la cuenta.'
      properties:
        token:
          type: string
        usuario:
          $ref: '#/components/schemas/Usuario'
      required:
      - token
      - usuario
    Usuario:
      type: object
      description: Datos públicos de una cuenta (solo lectura).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Correo electrónico
        first_name:
          type: string
          readOnly: true
          title: Nombre
        last_name:
          type: string
          readOnly: true
          title: Apellido
        telefono:
          type: string
          readOnly: true
          title: Teléfono
        rol:
          allOf:
          - $ref: '#/components/schemas/RolEnum'
          readOnly: true
        is_active:
          type: boolean
